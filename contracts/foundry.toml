[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
fs_permissions = [{ access = "read", path = "./" }]
optimizer = true
optimizer_runs = 200

remappings = [
  "forge-std/=dependencies/forge-std-1.9.6/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8547"

[etherscan]
# No `url`: forge uses the Etherscan V2 multichain API (the old basescan V1 endpoint is retired).
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[dependencies]
forge-std = "1.9.6"
"@openzeppelin-contracts" = "5.6.1"

[soldeer]
remappings_generate = false
